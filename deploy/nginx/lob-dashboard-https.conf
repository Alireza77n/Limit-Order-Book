server {
    listen 80;
    server_name dashboard.185-206-95-141.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/lob-dashboard-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dashboard.185-206-95-141.nip.io;

    ssl_certificate /etc/letsencrypt/live/dashboard.185-206-95-141.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.185-206-95-141.nip.io/privkey.pem;

    auth_basic "Limit Order Book Dashboard";
    auth_basic_user_file /etc/nginx/lob-dashboard.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /admin/ {
        # Separate Basic Auth realm/credentials from the dashboard's --
        # this is the admin management surface, not the read-only dashboard.
        auth_basic "Limit Order Book Demo Admin";
        auth_basic_user_file /etc/nginx/lob-admin.htpasswd;

        proxy_pass http://127.0.0.1:8653;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8652;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
