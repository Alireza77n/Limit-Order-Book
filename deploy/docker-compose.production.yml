name: limit-order-book

x-runtime-common: &runtime-common
  image: limit-order-book-demo:local
  user: "1000:1000"
  env_file:
    - demo.env
  read_only: true
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - limit-order-book-internal

services:
  session-init:
    <<: *runtime-common
    container_name: lob-session-init
    build:
      context: ..
      args:
        LOB_REVISION: ${LOB_REVISION:-uncommitted}
        LOB_BUILD_DATE: ${LOB_BUILD_DATE:-unknown}
    command:
      - python
      - demo_entrypoint.py
      - python
      - session.py
      - stack-init
      - --path
      - /app/runtime/state/stack_session.json
      - --worker-lock
      - /app/runtime/state/.worker_btcirt.lock
      - --worker-lock
      - /app/runtime/state/.worker_usdtirt.lock
    volumes:
      - ../runtime/state:/app/runtime/state
    restart: "no"
    pids_limit: 64
    cpus: "0.25"
    mem_limit: 64m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - session.py
        - load
        - --path
        - /app/runtime/state/stack_session.json
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64

  btc-demo:
    <<: *runtime-common
    container_name: lob-btc-demo
    profiles: ["paper"]
    command:
      - python
      - demo_entrypoint.py
      - python
      - run.py
      - --profile
      - btc
      - --mode
      - demo
      - --continuous
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/results:/app/runtime/results
      - ../runtime/state:/app/runtime/state
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    cpus: "0.50"
    # The production Python worker exceeds 128 MiB RSS under normal market
    # polling; keep it bounded but above the measured steady-state footprint.
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - |
          import fcntl
          from pathlib import Path
          from session import load_stack_session

          lock_file = Path("/app/runtime/state/.worker_btcirt.lock").open("a+")
          try:
              fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
          except BlockingIOError:
              load_stack_session("/app/runtime/state/stack_session.json")
          else:
              raise SystemExit("worker lease is not held")
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128

  usdt-demo:
    <<: *runtime-common
    container_name: lob-usdt-demo
    profiles: ["paper"]
    command:
      - python
      - demo_entrypoint.py
      - python
      - run.py
      - --profile
      - usdt
      - --mode
      - demo
      - --continuous
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/results:/app/runtime/results
      - ../runtime/state:/app/runtime/state
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    cpus: "0.50"
    # The USDT worker's steady-state Python RSS exceeds 128 MiB on the
    # production image; 256 MiB avoids an OOM restart loop while remaining
    # tightly bounded.
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - |
          import fcntl
          from pathlib import Path
          from session import load_stack_session

          lock_file = Path("/app/runtime/state/.worker_usdtirt.lock").open("a+")
          try:
              fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
          except BlockingIOError:
              load_stack_session("/app/runtime/state/stack_session.json")
          else:
              raise SystemExit("worker lease is not held")
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128

  dashboard:
    <<: *runtime-common
    container_name: lob-dashboard
    command:
      - python
      - demo_entrypoint.py
      - python
      - dashboard.py
    depends_on:
      session-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8652:8050"
    volumes:
      - ../runtime/results:/app/runtime/results:ro
      - ../runtime/state:/app/runtime/state:ro
      - /var/lib/market-maker-forward/results:/app/runtime/forward/results:ro
    environment:
      # Docker's host port proxy cannot reach a process bound to the
      # container loopback interface.  The published host port remains
      # loopback-only, so this does not expose the dashboard directly.
      DASHBOARD_HOST: 0.0.0.0
      LOB_FORWARD_RESULTS_DIR: /app/runtime/forward/results
      # 0 (default): the demo stack's dashboard offers every track -- the
      # paper workers' results (badge DEMO) and the live forward results
      # (badge REAL), never mixed in one view. Set
      # LOB_LIVE_ONLY_DASHBOARD=1 in deploy/demo.env to hide the demo
      # tracks from this public page.
      LOB_LIVE_ONLY_DASHBOARD: "${LOB_LIVE_ONLY_DASHBOARD:-0}"
    group_add:
      - "${FORWARD_CONTROL_GID:-986}"
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8050/', timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 128

  admin:
    <<: *runtime-common
    container_name: lob-admin
    env_file:
      - demo.env
      - path: admin.env
        required: false
      - path: admin-forward.env
        required: false
    command:
      - python
      - demo_entrypoint.py
      - python
      - admin_app.py
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/state:/app/runtime/state:ro
      - ../runtime/results:/app/runtime/results:ro
      - ../runtime/backups:/app/runtime/backups:ro
      - ../runtime/control:/app/runtime/control
      - /var/lib/market-maker-forward/control:/app/runtime/forward/control
      - /var/lib/market-maker-forward/config:/app/runtime/forward/config
      - /var/lib/market-maker-forward/locks:/app/runtime/forward/locks:ro
      - /var/lib/market-maker-forward/results:/app/runtime/forward/results:ro
    environment:
      LOB_FORWARD_RESULTS_DIR: /app/runtime/forward/results
      LOB_FORWARD_CONTROL_DIR: /app/runtime/forward/control
      LOB_FORWARD_CONFIG_DIR: /app/runtime/forward/config
      LOB_FORWARD_LOCK_DIR: /app/runtime/forward/locks
      LOB_FORWARD_ONLY_ADMIN: "1"
    group_add:
      - "${FORWARD_CONTROL_GID:-986}"
    ports:
      - "127.0.0.1:8653:8051"
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8051/admin/health', timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 128

networks:
  limit-order-book-internal:
    name: limit-order-book-internal
    driver: bridge
