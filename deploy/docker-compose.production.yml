name: limit-order-book

x-runtime-common: &runtime-common
  image: limit-order-book-demo:local
  env_file:
    - demo.env
  read_only: true
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - limit-order-book-internal

services:
  session-init:
    <<: *runtime-common
    container_name: lob-session-init
    build:
      context: ..
    command:
      - python
      - demo_entrypoint.py
      - session.py
      - stack-init
      - --path
      - /app/runtime/state/stack_session.json
      - --worker-lock
      - /app/runtime/state/.worker_btcirt.lock
      - --worker-lock
      - /app/runtime/state/.worker_usdtirt.lock
    volumes:
      - ../runtime/state:/app/runtime/state
    restart: "no"
    pids_limit: 64
    cpus: "0.25"
    mem_limit: 64m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - session.py
        - load
        - --path
        - /app/runtime/state/stack_session.json
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64

  btc-demo:
    <<: *runtime-common
    container_name: lob-btc-demo
    command:
      - python
      - demo_entrypoint.py
      - run.py
      - --profile
      - btc
      - --mode
      - demo
      - --continuous
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/results:/app/runtime/results
      - ../runtime/state:/app/runtime/state
    restart: unless-stopped
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 160m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /app/runtime/state/.worker_btcirt.lock && python demo_entrypoint.py
          session.py load --path /app/runtime/state/stack_session.json >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 160M
          pids: 128

  usdt-demo:
    <<: *runtime-common
    container_name: lob-usdt-demo
    command:
      - python
      - demo_entrypoint.py
      - run.py
      - --profile
      - usdt
      - --mode
      - demo
      - --continuous
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/results:/app/runtime/results
      - ../runtime/state:/app/runtime/state
    restart: unless-stopped
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 160m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /app/runtime/state/.worker_usdtirt.lock && python demo_entrypoint.py
          session.py load --path /app/runtime/state/stack_session.json >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 160M
          pids: 128

  dashboard:
    <<: *runtime-common
    container_name: lob-dashboard
    command:
      - python
      - demo_entrypoint.py
      - dashboard.py
    depends_on:
      session-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8652:8050"
    volumes:
      - ../runtime/results:/app/runtime/results:ro
    restart: unless-stopped
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8050/', timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128

networks:
  limit-order-book-internal:
    name: limit-order-book-internal
    internal: true
