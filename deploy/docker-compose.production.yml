name: limit-order-book

x-runtime-common: &runtime-common
  image: limit-order-book-demo:local
  env_file:
    - demo.env
  read_only: true
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - limit-order-book-internal

services:
  session-init:
    <<: *runtime-common
    container_name: lob-session-init
    build:
      context: ..
      args:
        LOB_REVISION: ${LOB_REVISION:-uncommitted}
        LOB_BUILD_DATE: ${LOB_BUILD_DATE:-unknown}
    command:
      - python
      - demo_entrypoint.py
      - python
      - session.py
      - stack-init
      - --path
      - /app/runtime/state/stack_session.json
      - --worker-lock
      - /app/runtime/state/.worker_btcirt.lock
      - --worker-lock
      - /app/runtime/state/.worker_usdtirt.lock
    volumes:
      - ../runtime/state:/app/runtime/state
    restart: "no"
    pids_limit: 64
    cpus: "0.25"
    mem_limit: 64m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - session.py
        - load
        - --path
        - /app/runtime/state/stack_session.json
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64

  btc-demo:
    <<: *runtime-common
    container_name: lob-btc-demo
    command:
      - python
      - demo_entrypoint.py
      - python
      - run.py
      - --profile
      - btc
      - --mode
      - demo
      - --continuous
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/results:/app/runtime/results
      - ../runtime/state:/app/runtime/state
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - |
          import fcntl
          from pathlib import Path
          from session import load_stack_session

          lock_file = Path("/app/runtime/state/.worker_btcirt.lock").open("a+")
          try:
              fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
          except BlockingIOError:
              load_stack_session("/app/runtime/state/stack_session.json")
          else:
              raise SystemExit("worker lease is not held")
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128

  usdt-demo:
    <<: *runtime-common
    container_name: lob-usdt-demo
    command:
      - python
      - demo_entrypoint.py
      - python
      - run.py
      - --profile
      - usdt
      - --mode
      - demo
      - --continuous
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/results:/app/runtime/results
      - ../runtime/state:/app/runtime/state
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - |
          import fcntl
          from pathlib import Path
          from session import load_stack_session

          lock_file = Path("/app/runtime/state/.worker_usdtirt.lock").open("a+")
          try:
              fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
          except BlockingIOError:
              load_stack_session("/app/runtime/state/stack_session.json")
          else:
              raise SystemExit("worker lease is not held")
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128

  dashboard:
    <<: *runtime-common
    container_name: lob-dashboard
    command:
      - python
      - demo_entrypoint.py
      - python
      - dashboard.py
    depends_on:
      session-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8652:8050"
    volumes:
      - ../runtime/results:/app/runtime/results:ro
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 192m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8050/', timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
          pids: 128

  admin:
    <<: *runtime-common
    container_name: lob-admin
    env_file:
      - demo.env
      - path: admin.env
        required: false
    command:
      - python
      - demo_entrypoint.py
      - python
      - admin_app.py
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/state:/app/runtime/state:ro
      - ../runtime/results:/app/runtime/results:ro
      - ../runtime/backups:/app/runtime/backups:ro
      - ../runtime/control:/app/runtime/control
    ports:
      - "127.0.0.1:8653:8051"
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 192m
    healthcheck:
      test:
        - CMD
        - python
        - demo_entrypoint.py
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8051/admin/health', timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
          pids: 128

networks:
  limit-order-book-internal:
    name: limit-order-book-internal
    driver: bridge
