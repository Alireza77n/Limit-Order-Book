  dashboard:
    build: .
    command: ["python", "dashboard.py"]
    env_file:
      - path: market_maker/.env
        required: false
    volumes:
      - ./market_maker/results:/app/market_maker/results:ro
    ports:
      - "8050:8050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8050', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3

  admin:
    build: .
    command: ["python", "admin_app.py"]
    environment:
      # Local-only login: admin/admin. Production uses deploy/admin.env with
      # unique credentials. `$$` escapes Compose interpolation so Werkzeug
      # receives the required single `$` hash separators.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: "pbkdf2:sha256:1000000$$Ny6yz2RscFqwoCia$$01c9dfea1ecb1a7272c8d30a48f28d5a3fa5ed1a3a8ab071100a2a5c1095a4be"
      ADMIN_SESSION_SECRET: local-demo-admin-session-secret
      # admin_app.py's own defaults are runtime/results, runtime/state, etc
      # (matching the production layout) -- point it at the same shared
      # volume the other local services actually use instead.
      LOB_RESULTS_DIR: /app/market_maker/results
      LOB_STATE_DIR: /app/market_maker/results
      LOB_CONTROL_DIR: /app/market_maker/results/control
      LOB_BACKUPS_DIR: /app/market_maker/results/backups
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ./market_maker/results:/app/market_maker/results:ro
      - ./market_maker/results/control:/app/market_maker/results/control
    ports:
      - "127.0.0.1:8051:8051"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8051/admin/health', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3

  control-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.control-agent
    # Bind-mounted at the *same* absolute host path (not /app) so that this
    # container's `docker compose -f docker-compose.yml ...` calls -- sent
    # over the mounted socket to the host daemon -- resolve relative volume
    # paths (like ./market_maker/results) against the real host project
    # directory instead of a path that only exists inside this container.
    # Requires `docker compose` to be invoked from the project root (as
    # documented above), so $PWD is that directory.
    working_dir: ${PWD}
    command: ["python", "-u", "deploy/control_agent.py", "--mode", "local"]
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      session-init:
        condition: service_completed_successfully
    restart: unless-stopped
