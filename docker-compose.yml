# Runs every market (btc, usdt, eth, xaut, trx) in demo (paper-trading) mode plus the history
# dashboard and the admin control panel, all sharing one results/ volume so
# the dashboard/admin see every worker's live output. README.md (Run, test,
# deploy) has the commands.
#
#   cp market_maker/.env.example market_maker/.env   # optional worker/Telegram settings; local Admin is fixed admin/admin
#   docker compose up --build
#
# Real (--mode real) trading isn't wired up here -- it needs a reachable
# MySQL server, which is out of scope while the project's focus is demo
# mode. Point MYSQL_HOST at your own
# server and swap a service's command below if/when that's needed.
#
# `docker compose up -d --build --wait` alone brings up a fully working
# stack: the `control-agent` service below runs deploy/control_agent.py so
# every Admin action (config edits, worker start/stop/restart, new session,
# backups) actually applies, with no separate host-side process needed. The
# Admin web container itself still has no Docker socket or host-process
# authority -- only `control-agent` does, and it exists only in this local
# compose file (never in deploy/docker-compose.production.yml).

services:
  session-init:
    build: .
    command:
      ["python", "session.py", "stack-init", "--path", "/app/market_maker/results/stack_session.json", "--worker-lock", "/app/market_maker/results/.worker_btcirt.lock", "--worker-lock", "/app/market_maker/results/.worker_usdtirt.lock", "--worker-lock", "/app/market_maker/results/.worker_ethirt.lock", "--worker-lock", "/app/market_maker/results/.worker_xautirt.lock", "--worker-lock", "/app/market_maker/results/.worker_trxirt.lock", "--worker-lock", "/app/market_maker/results/.worker_ahrm1irr.lock", "--worker-lock", "/app/market_maker/results/.worker_roba1irr.lock", "--worker-lock", "/app/market_maker/results/.worker_nogh1irr.lock", "--worker-lock", "/app/market_maker/results/.worker_zfam1irr.lock"]
    volumes:
      - ./market_maker/results:/app/market_maker/results
    restart: "no"

  btc-demo:
    build: .
    command: ["python", "run.py", "--profile", "btc", "--mode", "demo", "--continuous"]
    env_file:
      - path: market_maker/.env
        required: false
    environment:
      DEMO_SESSION_FILE: /app/market_maker/results/stack_session.json
    depends_on:
      session-init:
        condition: service_completed_successfully
    volumes:
      - ./market_maker/results:/app/market_maker/results
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "session.py", "load", "--path", "/app/market_maker/results/stack_session.json"]
      interval: 15s
      timeout: 5s
      retries: 3

  usdt-demo:
