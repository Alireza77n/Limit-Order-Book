{% extends "admin/base.html" %}

{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card">

    <h2>Error {{ code }}</h2>
  </div>
  <div class="card-body">

    <a href="{{ url_for('admin_index') }}" class="btn btn-secondary">Back to Overview</a>
  </div>
</div>
{% endblock %}
